<section class="auth-page">
  @if (submitted()) {
    <div class="card success">
      <h1>Check your email</h1>
      <p>If an account exists for that address, a password reset link is on its way. The link expires in 30 minutes.</p>
      <a routerLink="/login" class="btn btn-ghost">Back to sign in</a>
    </div>
  } @else {
    <form [formGroup]="form" (ngSubmit)="submit()" novalidate class="card">
      <h1>Forgot your password?</h1>
      <p class="lede">Enter your email and we'll send you a reset link.</p>

      <label>
        Email
        <input type="email" formControlName="email" autocomplete="email" />
      </label>

      <button type="submit" class="btn btn-primary" [disabled]="loading()">
        {{ loading() ? 'Sending…' : 'Send reset link' }}
      </button>

      <p class="switch"><a routerLink="/login">Back to sign in</a></p>
    </form>
  }
</section>
