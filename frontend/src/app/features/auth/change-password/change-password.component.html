<section class="auth-page">
  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <h1>Set a new password</h1>
    <p class="hint">Your account was created with a temporary password. Choose a new one before continuing.</p>

    <label>
      Current password
      <input type="password" formControlName="currentPassword" autocomplete="current-password" />
    </label>

    <label>
      New password
      <input type="password" formControlName="newPassword" autocomplete="new-password" />
      @if (form.controls.newPassword.touched && form.controls.newPassword.hasError('minlength')) {
        <span class="field-error">Must be at least 12 characters.</span>
      }
    </label>

    <label>
      Confirm new password
      <input type="password" formControlName="confirmPassword" autocomplete="new-password" />
    </label>

    @if (form.hasError('mismatch') && form.controls.confirmPassword.touched) {
      <p class="error">Passwords don't match.</p>
    }

    @if (errorMessage()) {
      <p class="error">{{ errorMessage() }}</p>
    }

    <button type="submit" [disabled]="loading()">
      {{ loading() ? 'Saving…' : 'Save new password' }}
    </button>
  </form>
</section>
