<section class="auth-page">
  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <h1>Create your account</h1>

    <app-google-signin-button></app-google-signin-button>
    <div class="divider"><span>or</span></div>

    <label>
      Full name
      <input type="text" formControlName="fullName" autocomplete="name" />
    </label>

    <label>
      Email
      <input type="email" formControlName="email" autocomplete="email" />
    </label>

    <label>
      Password
      <input type="password" formControlName="password" autocomplete="new-password" />
    </label>

    <label>
      Phone (optional)
      <input type="tel" formControlName="phone" autocomplete="tel" />
    </label>

    @if (errorMessage()) {
      <p class="error">{{ errorMessage() }}</p>
    }

    <button type="submit" [disabled]="loading()">
      {{ loading() ? 'Creating account…' : 'Create account' }}
    </button>

    <p class="switch">Already have an account? <a routerLink="/login">Sign in</a></p>
  </form>
</section>
