@if (stepUp.visible()) {
  <div class="step-up-backdrop" (click)="cancel()">
    <div class="step-up-dialog card" role="dialog" aria-modal="true" aria-labelledby="step-up-title" (click)="$event.stopPropagation()">
      <h2 id="step-up-title">Verify it's you</h2>
      <p class="muted">
        This action needs a fresh authenticator code. Enter the current 6-digit code from your
        authenticator app to continue.
      </p>

      <form [formGroup]="form" (ngSubmit)="submit()">
        <label>
          Authenticator code
          <input
            type="text"
            inputmode="numeric"
            autocomplete="one-time-code"
            maxlength="6"
            placeholder="000000"
            formControlName="code"
            autofocus
          />
        </label>

        @if (stepUp.errorMessage()) {
          <p class="error-text">{{ stepUp.errorMessage() }}</p>
        }

        <div class="step-up-actions">
          <button type="button" class="btn btn-ghost" (click)="cancel()">Cancel</button>
          <button type="submit" class="btn btn-primary" [disabled]="form.invalid || stepUp.submitting()">
            {{ stepUp.submitting() ? 'Verifying…' : 'Verify & continue' }}
          </button>
        </div>
      </form>
    </div>
  </div>
}
