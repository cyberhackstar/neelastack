<button
  type="button"
  class="theme-toggle"
  role="switch"
  [attr.aria-checked]="theme.mode() === 'light'"
  [attr.aria-label]="theme.mode() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'"
  [attr.title]="theme.mode() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'"
  (click)="theme.toggle()"
>
  <svg class="theme-toggle__track-icon theme-toggle__track-icon--sun" viewBox="0 0 24 24" fill="none" aria-hidden="true">
    <circle cx="12" cy="12" r="4.2" fill="currentColor" />
    <g stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
      <line x1="12" y1="1.5" x2="12" y2="3.8" />
      <line x1="12" y1="20.2" x2="12" y2="22.5" />
      <line x1="1.5" y1="12" x2="3.8" y2="12" />
      <line x1="20.2" y1="12" x2="22.5" y2="12" />
      <line x1="4.6" y1="4.6" x2="6.2" y2="6.2" />
      <line x1="17.8" y1="17.8" x2="19.4" y2="19.4" />
      <line x1="4.6" y1="19.4" x2="6.2" y2="17.8" />
      <line x1="17.8" y1="6.2" x2="19.4" y2="4.6" />
    </g>
  </svg>

  <svg class="theme-toggle__track-icon theme-toggle__track-icon--moon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
    <path
      d="M20.5 14.8A8.5 8.5 0 1 1 9.2 3.5a7 7 0 0 0 11.3 11.3Z"
      fill="currentColor"
    />
  </svg>

  <span class="theme-toggle__thumb">
    @if (theme.mode() === 'dark') {
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="12" cy="12" r="4.2" fill="currentColor" />
        <g stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <line x1="12" y1="1.5" x2="12" y2="3.8" />
          <line x1="12" y1="20.2" x2="12" y2="22.5" />
          <line x1="1.5" y1="12" x2="3.8" y2="12" />
          <line x1="20.2" y1="12" x2="22.5" y2="12" />
          <line x1="4.6" y1="4.6" x2="6.2" y2="6.2" />
          <line x1="17.8" y1="17.8" x2="19.4" y2="19.4" />
          <line x1="4.6" y1="19.4" x2="6.2" y2="17.8" />
          <line x1="17.8" y1="6.2" x2="19.4" y2="4.6" />
        </g>
      </svg>
    } @else {
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path
          d="M20.5 14.8A8.5 8.5 0 1 1 9.2 3.5a7 7 0 0 0 11.3 11.3Z"
          fill="currentColor"
        />
      </svg>
    }
  </span>
</button>
