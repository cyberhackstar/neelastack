<!doctype html>
<html lang="en">
  <head>
    <base href="/" />

    <meta charset="utf-8" />

    <!-- Applies the visitor's saved theme (or their OS preference) before
         any CSS/JS loads, so there's no flash of the wrong theme on first
         paint. Kept tiny and inline on purpose — this has to run
         synchronously, before the stylesheet below is applied. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('neelastack_theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>

    <title>
      Neelastack — Enterprise-grade Web Applications | Spring Boot & Angular
    </title>

    <meta
      name="description"
      content="Neelastack is Bhawesh Sharma's independent software engineering practice — production-grade Spring Boot and Angular applications for businesses that can't afford to ship fragile software."
    />

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0C0C0D" />
    <meta name="robots" content="index, follow" />

    <meta property="og:site_name" content="Neelastack" />
    <meta property="og:locale" content="en_IN" />

    <meta
      property="og:image"
      content="https://neelastack.com/assets/og/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta
      name="twitter:image"
      content="https://neelastack.com/assets/og/og-image.png"
    />

    <link rel="icon" type="image/svg+xml" href="/assets/horse.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Tiro+Devanagari+Sanskrit&display=swap"
    />
  </head>

  <body>
    <app-root></app-root>
  </body>
</html>
