spring:
  application:
    name: neelastack-backend

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope: openid,email,profile

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:neelastack}
    username: ${DB_USERNAME:neelastack}
    password: ${DB_PASSWORD:neelastack}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${SERVER_PORT:8080}
  compression:
    enabled: true
  error:
    include-message: always
  # Everything in prod reaches this app as: browser --https--> Cloudflare edge
  # --http--> cloudflared tunnel --http--> nginx (infra/nginx/neelastack.conf, which
  # sets X-Forwarded-Proto: https) --http--> here. Without this, Spring sees every
  # request as plain http (the actual socket it's on), which breaks anything that
  # builds an absolute URL from the request — most concretely, Google OAuth2 login
  # would generate an http:// redirect_uri and fail to match what's registered in the
  # Google Cloud Console. "framework" trusts standard X-Forwarded-* headers, which is
  # safe here specifically because nginx (not the public internet) is the only thing
  # that can reach this app directly (see docker-compose.prod.yml network layout) and
  # nginx sets that header itself rather than passing through whatever a client sent.
  forward-headers-strategy: framework

app:
  jwt:
    secret: ${JWT_SECRET:change-this-to-a-long-random-secret-in-production-min-256-bits}
    access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}       # 15 min
    refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}  # 7 days
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  admin-bootstrap:
    # First-boot admin provisioning (see AdminBootstrapRunner) -- replaces the old seeded
    # admin@neelastack.com/ChangeMe@123 row. Only used if no admin account exists yet; blank
    # by default so a forgotten env var fails loud (a log warning, no admin created) rather
    # than falling back to a guessable default.
    email: ${ADMIN_BOOTSTRAP_EMAIL:}
    password: ${ADMIN_BOOTSTRAP_PASSWORD:}
    full-name: ${ADMIN_BOOTSTRAP_FULL_NAME:Neelastack Admin}
  site:
    base-url: ${SITE_BASE_URL:https://neelastack.com}
    frontend-url: ${FRONTEND_URL:https://neelastack.com}
  mail:
    from: ${MAIL_FROM:no-reply@neelastack.com}
    admin-notification-address: ${MAIL_ADMIN_ADDRESS:admin@neelastack.com}
  sales:
    # Module 2 of the Client Acquisition & High-Ticket Conversion Engine: when a lead
    # scores Tier-1 (HOT — see LeadScoringService), the frontend shows an instant
    # booking widget instead of a generic "thank you" screen. Off by default (empty
    # URL) so a fresh/staging environment never shows a broken or placeholder embed;
    # InquiryService only ever returns a bookingUrl when both are set.
    booking-enabled: ${SALES_BOOKING_ENABLED:false}
    calendly-url: ${SALES_CALENDLY_URL:}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
    # Optional: enables real expiration on signed file URLs (see FileStorageService).
    # Requires turning on "Token-based authentication" in the Cloudinary console first.
    auth-token-key: ${CLOUDINARY_AUTH_TOKEN_KEY:}
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: ${RAZORPAY_KEY_SECRET:}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
    # PaymentReconciliationService's polling interval — 20 min default, within the
    # 15-30 min band the reconciliation daemon is required to run at.
    reconciliation-interval-ms: ${RAZORPAY_RECONCILE_INTERVAL_MS:1200000}
    # How long a CREATED payment_attempt is treated as still-valid before InvoiceService#
    # createOrder mints a fresh order instead of handing back a possibly-expired one.
    order-ttl-minutes: ${RAZORPAY_ORDER_TTL_MINUTES:60}
  indexnow:
    # Off by default so a fresh/staging environment never pings search engines with
    # non-production URLs. Generate any 8-64 char hex/alphanumeric string for the key
    # (e.g. `openssl rand -hex 16`) and set both as real environment variables in prod.
    enabled: ${INDEXNOW_ENABLED:false}
    key: ${INDEXNOW_KEY:}
  followups:
    # Thresholds for LeadFollowUpService's daily digest / the follow-ups analytics
    # endpoint — days since sentAt (unviewed) or lastViewedAt (viewed, no response)
    # before a proposal is surfaced as needing a nudge.
    unviewed-reminder-days: ${FOLLOWUP_UNVIEWED_REMINDER_DAYS:3}
    viewed-no-response-days: ${FOLLOWUP_VIEWED_NO_RESPONSE_DAYS:2}
  mfa:
    # AES-256 key (base64, 32 raw bytes after decoding) used to encrypt TOTP secrets at
    # rest — see TotpEncryptionService. Generate with `openssl rand -base64 32`. The
    # fallback below is an insecure dev-only placeholder (all-zero key) — same pattern
    # as JWT_SECRET's dev default — and StartupSecretsValidator refuses to boot the
    # `prod` profile if it's still in use there.
    encryption-key: ${MFA_ENCRYPTION_KEY:MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=}
    issuer: ${MFA_ISSUER:Neelastack Admin}
    # How long a step-up assertion (a recent successful TOTP/recovery-code check) stays
    # valid before high-risk mutation endpoints require re-verification.
    step-up-ttl-minutes: ${MFA_STEP_UP_TTL_MINUTES:10}

sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SPRING_PROFILES_ACTIVE:dev}
  traces-sample-rate: 0.1
  send-default-pii: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
