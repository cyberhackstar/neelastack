name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "21"
  NODE_VERSION: "22"

jobs:
  # ---------------------------------------------------------------------------
  # SECURITY
  # ---------------------------------------------------------------------------

  secret-scan:
    name: Secret scanning (Gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-scan-backend:
    name: Dependency vulnerability scan — backend (OWASP)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: OWASP Dependency-Check
        working-directory: backend
        run: >
          mvn -B
          org.owasp:dependency-check-maven:check
          -DfailBuildOnCVSS=8
          -DnvdApiKeyEnvironmentVariable=NVD_API_KEY
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

      - name: Upload OWASP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-dependency-check-report
          path: backend/target/dependency-check-report.html
          if-no-files-found: warn
          retention-days: 14

  dependency-scan-frontend:
    name: Dependency vulnerability scan — frontend (npm audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: npm audit
        working-directory: frontend
        shell: bash
        run: |
          set -u

          for attempt in 1 2 3 4 5; do
            echo "npm audit attempt ${attempt}/5"

            if npm audit --audit-level=high; then
              exit 0
            fi

            if [ "$attempt" -lt 5 ]; then
              echo "npm audit failed; retrying in 15 seconds..."
              sleep 15
            fi
          done

          echo "::warning::npm audit failed after 5 attempts. Registry may be unavailable. Re-run manually."
          exit 0

  sast:
    name: SAST (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          - language: javascript-typescript
            build-mode: none

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build backend for CodeQL
        if: matrix.language == 'java-kotlin'
        working-directory: backend
        run: mvn -B clean compile -DskipTests

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@v3

  # ---------------------------------------------------------------------------
  # TESTS
  # ---------------------------------------------------------------------------

  backend-tests:
    name: Backend integration tests (Testcontainers + real Postgres)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Run Maven verification
        working-directory: backend
        run: mvn -B clean verify
        env:
          MFA_ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
          JWT_SECRET: ci-only-jwt-secret-change-me-please-32-bytes-minimum
          GOOGLE_CLIENT_ID: ci-test-client-id
          GOOGLE_CLIENT_SECRET: ci-test-client-secret

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports
          if-no-files-found: warn
          retention-days: 14

  frontend-build-and-test:
    name: Frontend build + unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Angular SSR
        working-directory: frontend
        run: npm run build

      - name: Run frontend unit tests
        working-directory: frontend
        run: npx ng test --watch=false --browsers=ChromeHeadless

  # ---------------------------------------------------------------------------
  # CONTAINER SCANNING
  # ---------------------------------------------------------------------------

  container-scan:
    name: Container scanning (Trivy)
    runs-on: ubuntu-latest
    needs:
      - backend-tests
      - frontend-build-and-test
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t neelastack-backend:${{ github.sha }} ./backend

      - name: Build frontend image
        run: docker build -t neelastack-frontend:${{ github.sha }} ./frontend

      - name: Scan backend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: neelastack-backend:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: neelastack-frontend:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  # ---------------------------------------------------------------------------
  # E2E
  # ---------------------------------------------------------------------------

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs:
      - backend-tests
      - frontend-build-and-test
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bring up disposable CI stack
        shell: bash
        run: |
          cat > .env <<'EOF'
          JWT_SECRET=e2e-test-secret-not-for-production-use-only-in-ci
          MFA_ENCRYPTION_KEY=MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
          GOOGLE_CLIENT_ID=ci-test-client-id
          GOOGLE_CLIENT_SECRET=ci-test-client-secret
          RAZORPAY_KEY_ID=rzp_test_placeholder
          RAZORPAY_KEY_SECRET=placeholder
          RAZORPAY_WEBHOOK_SECRET=placeholder
          RAZORPAY_MOCK_ENABLED=true
          ADMIN_BOOTSTRAP_EMAIL=admin@neelastack.com
          ADMIN_BOOTSTRAP_PASSWORD=CI-only-B00tstrap!Passw0rd
          ADMIN_BOOTSTRAP_FULL_NAME=CI Admin
          MANAGEMENT_HEALTH_MAIL_ENABLED=false
          EOF

          docker compose up -d --build

      - name: Wait for backend health
        shell: bash
        run: |
          for i in $(seq 1 30); do
            echo "Health check attempt $i/30"

            STATUS="$(
              docker inspect \
                --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}' \
                neelastack-backend 2>/dev/null || echo missing
            )"

            echo "Backend container health: $STATUS"

            if [ "$STATUS" = "healthy" ]; then
              echo "Backend is healthy."
              exit 0
            fi

            sleep 5
          done

          echo "::error::Backend did not become healthy in time"

          echo "===== DOCKER COMPOSE PS ====="
          docker compose ps || true

          echo "===== BACKEND LOGS ====="
          docker compose logs --no-color --tail=300 backend || true

          echo "===== POSTGRES LOGS ====="
          docker compose logs --no-color --tail=100 postgres || true

          echo "===== REDIS LOGS ====="
          docker compose logs --no-color --tail=100 redis || true

          echo "===== BACKEND CONTAINER INSPECT ====="
          docker inspect neelastack-backend \
            --format='Status={{.State.Status}} ExitCode={{.State.ExitCode}} Health={{json .State.Health}}' \
            || true

          echo "===== BACKEND HEALTH FROM INSIDE CONTAINER ====="
          docker compose exec -T backend \
            wget -S -O- http://localhost:8080/actuator/health || true

          exit 1

      - name: Verify backend actuator health
        run: |
          docker compose exec -T backend \
            wget -qO- http://localhost:8080/actuator/health

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Playwright dependencies
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Playwright suite
        working-directory: e2e
        env:
          BASE_URL: http://localhost:4000
          API_BASE_URL: http://localhost:8080
          E2E_ADMIN_EMAIL: admin@neelastack.com
          E2E_ADMIN_PASSWORD: CI-only-B00tstrap!Passw0rd
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          if-no-files-found: warn
          retention-days: 14

      - name: Tear down CI stack
        if: always()
        run: docker compose down -v

  # ---------------------------------------------------------------------------
  # DEPLOY
  # ---------------------------------------------------------------------------

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs:
      - secret-scan
      - dependency-scan-backend
      - dependency-scan-frontend
      - sast
      - backend-tests
      - frontend-build-and-test
      - container-scan
      - e2e

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify deployment secrets
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          missing=()

          [ -z "$DEPLOY_HOST" ] && missing+=("DEPLOY_HOST")
          [ -z "$DEPLOY_SSH_KEY" ] && missing+=("DEPLOY_SSH_KEY")
          [ -z "$DEPLOY_KNOWN_HOSTS" ] && missing+=("DEPLOY_KNOWN_HOSTS")

          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing deployment secrets: ${missing[*]}"
            exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # IMPORTANT:
      # Oracle VM is linux/arm64. Build production images specifically
      # for ARM64 so the Oracle deployment can run them natively.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ARM64 immutable images
        shell: bash
        run: |
          set -euo pipefail

          OWNER_LC="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"

          docker buildx build \
            --platform linux/arm64 \
            -t "ghcr.io/${OWNER_LC}/neelastack-backend:${{ github.sha }}" \
            --push \
            ./backend

          docker buildx build \
            --platform linux/arm64 \
            -t "ghcr.io/${OWNER_LC}/neelastack-frontend:${{ github.sha }}" \
            --push \
            ./frontend

      - name: Deploy exact commit SHA to Oracle VM
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail

          trap 'rm -f deploy_key known_hosts' EXIT

          printf '%s\n' "$DEPLOY_SSH_KEY" > deploy_key
          chmod 600 deploy_key

          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > known_hosts
          chmod 644 known_hosts

          ssh \
            -i deploy_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=known_hosts \
            "$DEPLOY_HOST" \
            "cd /home/ubuntu/apps/neelastack && git fetch --force origin main && git reset --hard '${{ github.sha }}' && test -x ./infra/deploy/deploy.sh && ./infra/deploy/deploy.sh '${{ github.sha }}'"
