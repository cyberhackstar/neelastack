# Production stack for the Oracle Cloud VM, sitting behind a Cloudflare Tunnel
# (cloudflared, running natively on the host — not in this stack) rather than direct
# public exposure. Cloudflare terminates public TLS at its edge; the tunnel's ingress
# rule for this app is `neelastack.com -> http://localhost:4000` (plain HTTP, no
# certbot/443 needed here — that's Cloudflare's job, not this container's). This VM
# also runs other apps (apparel, electromart) behind the same tunnel and a *separate*
# host-level nginx already bound to :80/:443 for those — this stack intentionally never
# binds those ports and only ever binds 127.0.0.1:4000, so it can never collide with
# that other nginx or get accidentally exposed to the public internet directly
# (only cloudflared, running on the same host, can reach 127.0.0.1).
# Images are pulled from GHCR (built by GitHub Actions) rather than built locally.
# The bundled nginx here is a *reverse proxy only* (routes / -> frontend SSR,
# /api -> backend, plus SSR caching) — it does not do TLS.

services:
  postgres:
    image: postgres:16-alpine
    container_name: neelastack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [neelastack-net]

  redis:
    image: redis:7-alpine
    container_name: neelastack-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'redis-cli -a "$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [neelastack-net]

  backend:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/neelastack-backend:${IMAGE_TAG:-latest}
    container_name: neelastack-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRATION_MS: ${JWT_ACCESS_EXPIRATION_MS}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
      MAIL_ADMIN_ADDRESS: ${MAIL_ADMIN_ADDRESS}
      SITE_BASE_URL: ${SITE_BASE_URL}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
      SENTRY_DSN: ${SENTRY_DSN}
      # P0 fix: these three were previously missing from prod Compose, which meant
      # StartupSecretsValidator / CloudinaryConfig / AdminBootstrapRunner would either
      # fail closed on boot or silently skip creating an administrator.
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY}
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD}
      ADMIN_BOOTSTRAP_FULL_NAME: ${ADMIN_BOOTSTRAP_FULL_NAME:-Neelastack Admin}
    networks: [neelastack-net]

  frontend:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/neelastack-frontend:${IMAGE_TAG:-latest}
    container_name: neelastack-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      PORT: 4000
      INTERNAL_API_URL: http://backend:8080
    networks: [neelastack-net]

  nginx:
    image: nginx:1.27-alpine
    container_name: neelastack-nginx
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    # Loopback-only, single port — this is the ONE thing cloudflared's ingress rule
    # for neelastack.com (http://localhost:4000) needs to be able to reach. Binding to
    # 127.0.0.1 rather than 0.0.0.0 means this is unreachable from outside the VM even
    # if the cloud firewall/security-list were ever misconfigured — same defense-in-depth
    # pattern already used for the other apps' backend ports (127.0.0.1:8082/8083 in
    # the existing `docker ps` output). Nothing else in this stack publishes a port.
    ports:
      - "127.0.0.1:4000:80"
    volumes:
      - ./infra/nginx/neelastack.conf:/etc/nginx/conf.d/default.conf:ro
      - ssr_cache:/var/cache/nginx/ssr
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/api/v1/public/ping"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks: [neelastack-net]

networks:
  neelastack-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  ssr_cache:
