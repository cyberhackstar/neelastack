# Production stack for the Oracle Cloud VM, sitting behind a Cloudflare Tunnel.
#
# Architecture:
#   Internet
#      ↓
#   Cloudflare Edge / TLS
#      ↓
#   cloudflared (native on Oracle VM)
#      ↓
#   127.0.0.1:4000
#      ↓
#   nginx container
#      ├── /      → frontend SSR
#      └── /api   → backend
#
# cloudflared is NOT part of this Compose stack.
#
# This stack intentionally exposes ONLY:
#   127.0.0.1:4000 → nginx:80
#
# Backend, frontend, Postgres and Redis are internal to the Docker network.
# The backend port 8080 is NOT published to the host.
#
# Images are pulled from GHCR and identified by IMAGE_TAG.
# GitHub Actions builds immutable ARM64 images using the commit SHA.

services:
  # ---------------------------------------------------------------------------
  # POSTGRES
  # ---------------------------------------------------------------------------

  postgres:
    image: postgres:16-alpine
    container_name: neelastack-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - neelastack-net

  # ---------------------------------------------------------------------------
  # REDIS
  # ---------------------------------------------------------------------------

  redis:
    image: redis:7-alpine
    container_name: neelastack-redis
    restart: unless-stopped

    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]

    volumes:
      - redis_data:/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli -a '${REDIS_PASSWORD}' --no-auth-warning ping | grep -q PONG",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

    networks:
      - neelastack-net

  # ---------------------------------------------------------------------------
  # BACKEND
  # ---------------------------------------------------------------------------

  backend:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/neelastack-backend:${IMAGE_TAG:-latest}
    container_name: neelastack-backend
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    environment:
      SPRING_PROFILES_ACTIVE: prod

      # PostgreSQL
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}

      # JWT
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRATION_MS: ${JWT_ACCESS_EXPIRATION_MS}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS}

      # CORS / URLs
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      SITE_BASE_URL: ${SITE_BASE_URL}
      FRONTEND_URL: ${FRONTEND_URL}

      # Email
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
      MAIL_ADMIN_ADDRESS: ${MAIL_ADMIN_ADDRESS}

      # Cloudinary
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}

      # Razorpay
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}

      # Google OAuth
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}

      # Sentry
      SENTRY_DSN: ${SENTRY_DSN}

      # MFA
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY}

      # Initial administrator bootstrap
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD}
      ADMIN_BOOTSTRAP_FULL_NAME: ${ADMIN_BOOTSTRAP_FULL_NAME:-Neelastack Admin}

    # IMPORTANT:
    # No "ports:" section here.
    #
    # The backend remains reachable only from the Docker network:
    #   http://backend:8080
    #
    # nginx talks to it internally.
    # Nothing on the public host can directly connect to port 8080.

    healthcheck:
      test:
        [
          "CMD-SHELL",
          'wget -qO- http://127.0.0.1:8080/actuator/health | grep -q ''"status":"UP"''',
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

    networks:
      - neelastack-net

  # ---------------------------------------------------------------------------
  # FRONTEND
  # ---------------------------------------------------------------------------

  frontend:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/neelastack-frontend:${IMAGE_TAG:-latest}
    container_name: neelastack-frontend
    restart: unless-stopped

    depends_on:
      backend:
        condition: service_healthy

    environment:
      PORT: 4000
      INTERNAL_API_URL: http://backend:8080

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

    networks:
      - neelastack-net

  # ---------------------------------------------------------------------------
  # NGINX
  # ---------------------------------------------------------------------------
  #
  # nginx is the ONLY service published to the Oracle host.
  #
  # Host:
  #   127.0.0.1:4000
  #
  # Container:
  #   nginx:80
  #
  # cloudflared connects to:
  #   http://localhost:4000
  #
  # There is intentionally NO 80:80 and NO 443:443 binding here.

  nginx:
    image: nginx:1.27-alpine
    container_name: neelastack-nginx
    restart: unless-stopped

    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy

    ports:
      - "127.0.0.1:4000:80"

    volumes:
      - ./infra/nginx/neelastack.conf:/etc/nginx/conf.d/default.conf:ro
      - ssr_cache:/var/cache/nginx/ssr

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:80/api/v1/public/ping | grep -q .",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

    networks:
      - neelastack-net

# ---------------------------------------------------------------------------
# NETWORKS
# ---------------------------------------------------------------------------

networks:
  neelastack-net:
    driver: bridge

# ---------------------------------------------------------------------------
# VOLUMES
# ---------------------------------------------------------------------------

volumes:
  postgres_data:
  redis_data:
  ssr_cache:
