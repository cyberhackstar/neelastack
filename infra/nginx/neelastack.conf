# Reverse proxy: neelastack.com -> Angular SSR (4000), /api -> Spring Boot (8080)
#
# Topology: Cloudflare Tunnel (cloudflared, running natively on the Oracle VM host)
# terminates public TLS at Cloudflare's edge and forwards plain HTTP to this container
# via the ingress rule `neelastack.com -> http://localhost:4000`. That means:
#   - There is no certbot/Let's Encrypt here and no 443 listener. Doing origin-side TLS
#     as well would be redundant at best; it would also break the tunnel outright, since
#     cloudflared expects a plain-HTTP origin at that port, not a TLS handshake.
#   - This container binds only 127.0.0.1:4000 on the host (see docker-compose.prod.yml),
#     so the *only* thing that can ever reach this listener is cloudflared on the same
#     box. It is never exposed on the VM's public interface, and it never touches the
#     host's own nginx on :80/:443 (that nginx belongs to the other apps on this VM and
#     is untouched by this stack).
#   - Every request nginx receives here has therefore already come through Cloudflare's
#     HTTPS edge, even though the hop from cloudflared to here is plain HTTP. Headers
#     below are set accordingly (X-Forwarded-Proto is hardcoded to https, not derived
#     from $scheme, which would incorrectly say "http" for every request at this layer).

proxy_cache_path /var/cache/nginx/ssr levels=1:2 keys_zone=ssr_cache:20m max_size=100m
                  inactive=60m use_temp_path=off;

server {
    listen 80;
    server_name neelastack.com www.neelastack.com _;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Safe to send even though TLS itself is handled upstream by Cloudflare: this header
    # only ever reaches the browser riding inside the HTTPS response Cloudflare already
    # served, so it still does its job (tell the browser to only ever use HTTPS for this
    # origin going forward). max-age is 2 years with preload — only add "preload" once
    # you've verified every subdomain genuinely serves HTTPS, since preload lists are
    # slow to reverse.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self)" always;
    # Built from the actual third parties this app loads (see review item #7): Google
    # Fonts, Google Analytics, Razorpay's checkout script + iframe, Cloudinary-hosted
    # images, and Google OAuth. 'unsafe-inline' on style-src is here because Angular's
    # component styles are injected inline; tightening that further needs a nonce/hash
    # strategy wired through the Angular build, which is out of scope for a header edit.
    # Test every flow (checkout, OAuth login, font loading, GA) before deploying this —
    # a copy-pasted CSP is exactly what item #7 warns against.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.googletagmanager.com https://www.google-analytics.com https://checkout.razorpay.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://res.cloudinary.com https://www.google-analytics.com; connect-src 'self' https://www.google-analytics.com https://api.razorpay.com; frame-src https://checkout.razorpay.com https://accounts.google.com; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

    # Generates a correlation ID here if the client didn't send one, so every request has
    # one ID from the edge onward. Spring Boot's RequestIdFilter trusts and reuses this
    # value rather than minting its own (see backend filter/RequestIdFilter.java).
    proxy_set_header X-Request-ID $request_id;
    add_header X-Request-ID $request_id always;

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /sitemap.xml {
        proxy_pass http://backend:8080/sitemap.xml;
        proxy_set_header Host $host;
    }

    location = /robots.txt {
        proxy_pass http://backend:8080/robots.txt;
        proxy_set_header Host $host;
    }

    # Spring Security's OAuth2 login lives at the server root (outside /api/v1) — see
    # SecurityConfig.PUBLIC_ENDPOINTS ("/oauth2/**", "/login/oauth2/**"). Without these two
    # blocks both the initial redirect to Google (/oauth2/authorization/google) and Google's
    # callback (/login/oauth2/code/google) fall through to the catch-all `location /` below
    # and get sent to the Angular frontend instead of the backend, which has no such route
    # and returns a 404 — this is what was causing "Google login shows a 404".
    location /oauth2/ {
        proxy_pass http://backend:8080/oauth2/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /login/oauth2/ {
        proxy_pass http://backend:8080/login/oauth2/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://frontend:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # GET/HEAD only (POST/PUT/etc. bypass automatically since they're not cacheable
        # methods for nginx's default cache key regardless). A logged-in visitor and an
        # anonymous one see the same public marketing/content HTML on every route this
        # reaches (auth-adjacent routes never reach this block — see server.ts's
        # NO_CACHE_PATH_PREFIXES, which set their own no-store and nginx honors that),
        # so caching by URL alone, without varying on cookies, is safe here.
        proxy_cache ssr_cache;
        proxy_cache_valid 200 60s;
        # Serve a stale copy instead of waiting on a slow/failed origin render — this is
        # the actual mechanism behind server.ts's stale-while-revalidate header.
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status always;
    }
}